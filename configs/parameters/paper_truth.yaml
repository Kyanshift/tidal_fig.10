      formula: 1.5 * 1000000
      source: penev2018
      kind: conditional_normalization_not_automatic_brahm_correction
      condition: Same ordinary Q and k2; assumes Brahm number is Penev Q_prime.
    reboundx_mapping_status: unverified_no_time_lag_conversion

