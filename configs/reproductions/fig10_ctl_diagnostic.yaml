  integrator: ias15
  direction: forward
  time_origin: elapsed_years_from_present_observed_state
  end_time_year: 2.0398729713101442
  output_interval_year: 0.031873015176721003
  convergence_tolerance: null
  max_step_year: 0.031873015176721003
  tolerance: 1.0e-10
  event_tolerance_year: 10.0
  events:
    engulfment: terminate_forward_q_le_Rstar
    roche: annotate_continue_idealized_paper_model
