- vendor/reboundx/src/tides_constant_time_lag.c
notes:
- Deterministic centre only; no joint posterior recovered.
- High eccentricity is extrapolation of truncated Jackson equations.
- Roche crossing is not a hydrodynamic disruption calculation.
- a/e ODE with zero N-body particles; time is elapsed 365-day years.
- Historical mass 1.101 Msun deliberately separate from paper Table2 1.104 Msun.
