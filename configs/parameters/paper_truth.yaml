quality_factor_conventions:
  jackson2009:
    symbol: Q_prime
    definition: modified_tidal_dissipation_parameter
    verification: explicitly_modified_in_equations_1_2_and_following_text
    ordinary_Q_conversion: 3 * Q / (2 * k2)
    normalization_source: jackson2008_normalization
    note: Normalization checked; transfer across forcing frequencies, bodies and models remains provisional.
    example_choices_not_universal: {figure_2_q_prime_planet: 3162277.6601683795, section_3_1_q_prime_star: 1000000}
  penev2018:
    symbol: Q_prime_star
    formula_as_printed: Q_star / k2
    verification: visually_checked_PDF_page_1
  lainey2009:
    directly_measured_quantity: k2_over_Q
    body: Jupiter
    forcing_context: Io_tidal_excitation
    value: 0.00001102
    unit: dimensionless
    uncertainty: {minus: 0.00000203, plus: 0.00000203, type: reported_formal_1sigma}
    source: lainey2009
    locator: 'PDF page 1, journal page 957'
    ordinary_Q_at_assumed_k2:
      value: 35600
      unit: dimensionless
      uncertainty: {minus: 6600, plus: 6600, type: reported_1sigma}
      assumed_k2: 0.379
      source: lainey2009
      locator: 'PDF page 2, journal page 958'
    transfer_to_K2_261b: unverified_model_assumption_not_target_measurement
  operational_fig10_mapping:
    numerical_denominators: {q_prime_star: 1000000, q_prime_planet: 30000}
    convention: jackson2009_modified
    status: provisional_interpretation_of_brahm_not_an_additional_measurement
    rationale: Brahm invokes Jackson equations but prints unprimed Q; legacy denominators follow Jackson coefficients.
    ordinary_Q_conversion_enabled: false
    reboundx_time_lag_conversion_enabled: false
    unresolved: [brahm_intended_physical_definition, love_numbers, spins, forcing_frequency, constant_Q_vs_constant_time_lag]
  legacy_fig10_mapping:
    numerical_denominators: {q_prime_star: 1000000, q_prime_planet: 32000}
    convention: jackson2009_modified_effective_denominators
    status: code_denominators_checked_physical_interpretation_provisional
    source: legacy_tidal
    locator: 'Qp, Qs; get_ecc_change; get_sma_change'
    priority: first_nominal_curve_reproduction_candidate
    heating_only_conversion: 'Qpp = 3*Qp/(2*0.37); used in H0, not orbital derivatives'
    automatically_convert_denominators: false
  conditional_definition_comparisons:
    lainey_to_jackson:
      q_prime_planet: 136116.15245009074
      formula: 3 / (2 * k2_over_Q)
      source: lainey2009
      kind: derived_Jupiter_central_value_not_K2_261b_measurement
    legacy_ordinary_Q_hypothesis:
      q_prime_planet: 129729.72972972973
      formula: 3 * 32000 / (2 * 0.37)
      source: legacy_tidal
      kind: hypothetical_ordinary_Q_interpretation_of_legacy_input
    penev_to_jackson:
